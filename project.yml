name: Verba

options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  VerbaKit:
    path: Packages/VerbaKit

targets:
  Verba:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: VerbaKit
        product: Core
      - package: VerbaKit
        product: Persistence
      - package: VerbaKit
        product: ClaudeBridge
      - package: VerbaKit
        product: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.education
        NSPrincipalClass: NSApplication
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode 27 drops Hardened Runtime for ad hoc signing unless asked explicitly.
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        CODE_SIGN_ENTITLEMENTS: App/Verba.entitlements
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.verba.app.dev
          PRODUCT_NAME: Verba Dev
          # Keep Debug code in one binary: Hardened Runtime with ad hoc signing
          # refuses to load Xcode's separately signed `*.debug.dylib`.
          ENABLE_DEBUG_DYLIB: NO
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.verba.app
          PRODUCT_NAME: Verba

schemes:
  Verba:
    build:
      targets:
        Verba: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
